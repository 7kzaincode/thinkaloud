<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Testbench Store</title>
<style>
  body { margin: 0; font: 18px "Segoe UI", system-ui, sans-serif; background: #fafafa; color: #111; }
  header { display: flex; gap: 16px; align-items: center; padding: 16px 24px; border-bottom: 1px solid #ddd; }
  #swatch { position: fixed; right: 24px; top: 90px; width: 160px; height: 160px; background: rgb(128,128,128); border-radius: 8px; }
  main { padding: 24px; display: grid; grid-template-columns: 420px 1fr; gap: 24px; }
  label { display: block; margin: 12px 0 4px; }
  input { font: inherit; padding: 8px 10px; width: 360px; }
  button { font: inherit; padding: 10px 18px; }
  #list { height: 420px; overflow-y: scroll; border: 1px solid #ccc; width: 360px; }
  #list div { padding: 10px 14px; border-bottom: 1px solid #eee; }
  #flashpad { position: fixed; right: 24px; top: 270px; width: 160px; height: 120px; background: #000; }
</style>
</head>
<body>
  <header>
    <b>Testbench Store</b>
    <a id="page2" href="page2.html">Go to page 2</a>
  </header>
  <div id="swatch" aria-hidden="true"></div>
  <div id="flashpad" aria-hidden="true"></div>
  <main>
    <section>
      <button id="cart">Add to Cart</button>
      <button id="flash">Flash</button>
      <label for="search">Search</label>
      <input id="search" type="text" autocomplete="off">
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="off">
    </section>
    <section>
      <div id="list" aria-label="Results">
        <script>for (let i = 1; i <= 80; i++) document.write(`<div>Result ${i}</div>`);</script>
      </div>
    </section>
  </main>
<script>
  // The swatch encodes state for pixel checks: gray initial, green after Add to Cart.
  // The flash pad toggles black/white on each Flash click and beeps (for sync measurement).
  document.getElementById("cart").onclick = () => { document.getElementById("swatch").style.background = "rgb(0,170,0)"; };
  let on = false, ctx = null;
  document.getElementById("flash").onmousedown = () => {
    on = !on;
    document.getElementById("flashpad").style.background = on ? "#fff" : "#000";
    try {
      ctx = ctx || new AudioContext();
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.value = 1000; g.gain.value = 0.3; o.connect(g).connect(ctx.destination);
      o.start(); o.stop(ctx.currentTime + 0.08);
    } catch (e) {}
  };
</script>
</body>
</html>
