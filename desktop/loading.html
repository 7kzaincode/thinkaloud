<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'">
<title>thinkaloud</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    display: grid; place-items: center; background: #f3f0e8; color: #1c1b18;
    font: 15px/1.5 "Segoe UI", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) { body { background: #151513; color: #ece8df; } }
  .mark { font: 600 28px "Segoe UI", system-ui, sans-serif; letter-spacing: -0.02em; }
  .sub { color: #8a8478; font-size: 13px; }
  .bar { width: 160px; height: 3px; background: #dcd6c8; border-radius: 2px; overflow: hidden; margin: 18px auto 0; }
  .bar i { display: block; width: 40%; height: 100%; background: #2743d6; animation: slide 1.1s ease-in-out infinite; }
  @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(260%); } }
</style>
</head>
<body>
  <div style="text-align:center">
    <div class="mark">thinkaloud</div>
    <div class="sub">starting…</div>
    <div class="bar"><i></i></div>
  </div>
</body>
</html>
