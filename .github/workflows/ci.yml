name: CI

on:
  push:
  pull_request:

jobs:
  processor:
    name: Processor tests (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: processor/requirements*.txt
      - run: pip install -r processor/requirements-dev.txt
      - run: python -m pytest -q
        working-directory: processor

  viewer:
    name: Viewer tests and typecheck (Node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: viewer
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
